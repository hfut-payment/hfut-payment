name: Android release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      signed_candidate:
        description: Build a signed candidate without publishing it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SIGNED_BUILD: ${{ github.ref_type == 'tag' || inputs.signed_candidate }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag for each public main update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
        run: |
          version=$(sed -n 's/^versionName=//p' version.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$ ]]
          release_commit=$(git rev-parse "refs/tags/v$version^{commit}")
          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            git merge-base --is-ancestor "$release_commit" "$GITHUB_SHA"
            # Distribution fixes can be deployed without retagging a published APK.
            git diff --quiet "$release_commit" "$GITHUB_SHA" -- . \
              ':(exclude).github/workflows/release.yml' \
              ':(exclude).github/workflows/mirror-gitee.yml' \
              ':(exclude)scripts/prepare_gitee_release.sh' \
              ':(exclude)scripts/publish_gitee.sh'
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      - name: Check clean source build
        if: env.SIGNED_BUILD != 'true'
        run: ./gradlew --no-daemon assembleDebug
      - name: Save debug APK
        if: env.SIGNED_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Verify signing configuration
        if: env.SIGNED_BUILD == 'true'
        env:
          SIGNING_KEY: ${{ secrets.HFUT_SIGNING_P12_B64 }}
          SIGNING_PASSWORD: ${{ secrets.HFUT_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_KEY" || -z "$SIGNING_PASSWORD" ]]; then
            echo '::error::Configure HFUT_SIGNING_P12_B64 and HFUT_SIGNING_PASSWORD before building a signed candidate.'
            exit 1
          fi
      - name: Prepare official wearable SDK
        if: env.SIGNED_BUILD == 'true'
        run: bash scripts/fetch_wear_sdk.sh
      - name: Read pinned wearable source revision
        id: band
        if: env.SIGNED_BUILD == 'true'
        run: |
          pin=$(cat band-source.sha)
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out wearable source
        if: env.SIGNED_BUILD == 'true'
        uses: actions/checkout@v5
        with:
          repository: hfut-payment/hfut-payment-band
          ref: ${{ steps.band.outputs.pin }}
          token: ${{ secrets.HFUT_BAND_READ_TOKEN || github.token }}
          path: .sources/band
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: env.SIGNED_BUILD == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .sources/band/package-lock.json
      - name: Prepare wearable build dependencies
        if: env.SIGNED_BUILD == 'true'
        working-directory: .sources/band
        run: npm ci --ignore-scripts
      - name: Build and verify embedded RPK from source
        if: env.SIGNED_BUILD == 'true'
        env:
          HFUT_SIGNING_P12_B64: ${{ secrets.HFUT_SIGNING_P12_B64 }}
          CAMPUS_SIGNING_PASSWORD: ${{ secrets.HFUT_SIGNING_PASSWORD }}
        run: node scripts/stage_band_rpk.mjs .sources/band release
      - name: Build and verify release
        id: release
        if: env.SIGNED_BUILD == 'true'
        env:
          HFUT_SIGNING_P12_B64: ${{ secrets.HFUT_SIGNING_P12_B64 }}
          CAMPUS_SIGNING_PASSWORD: ${{ secrets.HFUT_SIGNING_PASSWORD }}
          CAMPUS_USAGE_URL: ${{ vars.CAMPUS_USAGE_URL }}
          CAMPUS_USAGE_PUBLISHABLE_KEY: ${{ vars.CAMPUS_USAGE_PUBLISHABLE_KEY }}
          GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
        run: |
          [[ "$GITHUB_REPOSITORY" == "hfut-payment/hfut-payment" ]]
          version=$(sed -n 's/^versionName=//p' version.properties)
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]]
            git merge-base --is-ancestor HEAD refs/remotes/origin/main
          fi
          export CAMPUS_UPDATE_FEED="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update.json"
          if [[ -n "$GITEE_REPOSITORY" ]]; then
            [[ "$GITEE_REPOSITORY" =~ ^[a-zA-Z0-9_-]+/[a-zA-Z0-9_.-]+$ ]]
            export CAMPUS_UPDATE_MIRROR="https://gitee.com/api/v5/repos/$GITEE_REPOSITORY/releases/latest"
          fi
          bash scripts/build_release.sh "$tag"
          apk="dist/release/$tag/HFUT-Campus-Companion-$version.apk"
          shopt -s nullglob
          installers=(app/src/withBand/assets/HFUT-Campus-Band-*.rpk)
          [[ "${#installers[@]}" == 1 ]]
          unzip -p "$apk" "assets/${installers[0]##*/}" | cmp - "${installers[0]}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Save verified release files
        if: env.SIGNED_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/release/${{ steps.release.outputs.tag }}/HFUT-Campus-Companion-*.apk
            dist/release/${{ steps.release.outputs.tag }}/SHA256SUMS.txt
            dist/release/${{ steps.release.outputs.tag }}/update.json
          if-no-files-found: error

  stage-release:
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: public-android-distribution
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - name: Prepare GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_github.sh "$GITHUB_REF_NAME" release
